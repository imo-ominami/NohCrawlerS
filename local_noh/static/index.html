<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d35">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="能公演">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>能公演を探す</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .search-panel {
      grid-template-columns: minmax(220px, 2fr) minmax(150px, 1fr) minmax(260px, 1.5fr) auto;
    }
    .date-range-field { min-width: 0; }
    .date-range-heading {
      display: block;
      margin-bottom: 8px;
      color: #52615c;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .06em;
    }
    .date-range-inputs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 6px;
      align-items: center;
    }
    .date-range-inputs input { min-width: 0; padding: 0 6px; }
    .date-range-inputs span { color: var(--muted); }
    @media (max-width: 900px) {
      .search-panel { grid-template-columns: 1fr 1fr; }
      .query-field, .date-range-field, .clear-button { grid-column: 1 / -1; }
    }
    @media (max-width: 390px) {
      .search-panel { grid-template-columns: 1fr; }
      .query-field, .date-range-field, .clear-button { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">能</span><span>能公演案内<small>NOH PERFORMANCE GUIDE</small></span></a>
    <button id="favorites-toggle" class="favorites-toggle" type="button" aria-pressed="false"><span aria-hidden="true">♡</span> お気に入り <b id="favorite-count">0</b></button>
  </header>
  <main>
    <section class="intro"><p class="eyebrow">TRADITIONAL PERFORMING ARTS</p><h1>能の舞台に、<br class="mobile-break">出会う。</h1><p>全国の能・狂言公演を検索できます。</p></section>
    <section class="search-panel" aria-label="公演検索">
      <label class="query-field"><span>キーワード</span><input id="query" type="search" placeholder="公演名・会場・地域で検索" autocomplete="off"></label>
      <label><span>開催地</span><select id="prefecture"><option value="">すべての地域</option></select></label>
      <div class="date-range-field">
        <span class="date-range-heading">開催期間</span>
        <div class="date-range-inputs">
          <label><span>開始日</span><input id="date-from" type="date"></label>
          <span aria-hidden="true">〜</span>
          <label><span>終了日</span><input id="date-to" type="date"></label>
        </div>
      </div>
      <button id="clear" class="clear-button" type="button">条件をクリア</button>
    </section>
    <div class="results-head"><p id="result-count" aria-live="polite">公演情報を読み込み中…</p><label class="sort-label">並び順 <select id="sort"><option value="date">開催日が近い順</option><option value="date-desc">開催日が遠い順</option></select></label></div>
    <section id="results" class="results" aria-label="公演一覧"></section>
    <section id="empty" class="empty" hidden><span>◌</span><h2>該当する公演がありません</h2><p>検索条件を変更して、もう一度お試しください。</p></section>
    <p id="data-note" class="data-note"></p>
  </main>
  <footer><span>能公演案内</span><span>公演情報は各主催者の掲載内容をご確認ください。</span></footer>
  <script src="app.js" defer></script>
</body>
</html>
