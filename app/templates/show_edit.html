{% extends 'base.html' %}
{% block title %}公演情報編集{% endblock %}
{% block content %}
{% if mode == "new" %}
    <h1>公演情報新規登録</h1>
{% else %}
    <h1>公演情報編集</h1>
{% endif %}

<div class="mb-3">
    <a class="btn btn-outline-secondary" href="/shows">一覧へ戻る</a>
    <button class="btn btn-primary" type="submit" form="show-edit-form">保存</button>
    {% if mode == "edit" %}
    <form method="post" action="/shows/delete/{{ row.id }}" style="display:inline;">
        <button type="submit" class="btn btn-danger"
            onclick="return confirm('削除します。よろしいですか？');">削除</button>
    </form>
    {% endif %}
</div>

{% if mode == "new" %}
    <form id="show-edit-form" method="post" action="/shows/create">
{% else %}
    <form id="show-edit-form" method="post" action="/shows/update/{{ row.id }}">
{% endif %}

<div class="mb-3">
    <label class="form-label" for="showdate">公演日</label>
    <input class="form-control show-date show-edit-date" id="showdate" type="date" name="showdate"
        value="{{ row.showdate.replace('/', '-') if mode == 'edit' else '' }}" required>
</div>

<div class="mb-3">
    <label class="form-label" for="prefucture">都道府県</label>
    <select class="form-select show-prefecture show-edit-prefecture" id="prefucture" name="prefucture">
        <option value="">選択してください</option>
        {% for prefecture in prefectures %}
        <option value="{{ prefecture.prefucture }}"
            {% if mode == 'edit' and row.prefucture == prefecture.prefucture %}selected{% endif %}>
            {{ prefecture.prefucture }}
        </option>
        {% endfor %}
    </select>
</div>

<div class="mb-3">
    <label class="form-label" for="showname">公演名</label>
    <input class="form-control" id="showname" type="text" name="showname"
        value="{{ row.showname if mode == 'edit' else '' }}" required>
</div>

<div class="mb-3">
    <label class="form-label" for="venues">会場</label>
    <input class="form-control" id="venues" type="text" name="venues"
        value="{{ row.venues if mode == 'edit' and row.venues else '' }}">
</div>

<div class="mb-3">
    <label class="form-label" for="starttime">開始時間</label>
    <input class="form-control show-edit-starttime" id="starttime" type="text" name="starttime"
        value="{{ row.starttime if mode == 'edit' and row.starttime else '' }}">
</div>

<div class="mb-3">
    <label class="form-label" for="memo">備考</label>
    <textarea class="form-control" id="memo" name="memo" rows="3">{{ row.memo if mode == 'edit' and row.memo else '' }}</textarea>
</div>

<div class="mb-3">
    <label class="form-label" for="url">URL</label>
    <input class="form-control" id="url" type="url" name="url"
        value="{{ row.url if mode == 'edit' else '' }}" required>
</div>

</form>

<script>
    document.getElementById("show-edit-form").addEventListener("keydown", (event) => {
        if (
            event.key === "Enter"
            && event.target.matches('input[type="text"], input[type="url"]')
        ) {
            event.preventDefault();
        }
    });
</script>
{% endblock %}
