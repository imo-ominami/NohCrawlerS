{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<main class="login-panel mx-auto" style="max-width: 420px;">
    <h1>ログイン</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        <div class="mb-3">
            <label class="form-label" for="username">ユーザー名</label>
            <input class="form-control" id="username" name="username" maxlength="255" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">パスワード</label>
            <input class="form-control" id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">ログイン</button>
    </form>
    {% if initial_setup %}
    <p class="mt-3">初回利用の場合は<a href="/setup">初期管理者を作成</a>してください。</p>
    {% endif %}
</main>
{% endblock %}
